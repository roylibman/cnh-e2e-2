# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-gate1606-1
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - postgres.yaml
  - pdb.yaml
images:
  - name: app
    newName: ghcr.io/roylibman/cnh-e2e-2
    newTag: 530192f
